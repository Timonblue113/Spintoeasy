<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SPINEASY BASIC DASHBOARD
</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

:root{

    --primary:#c1121f;

    --gold:#ffd700;

    --dark:#121212;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:'Segoe UI',sans-serif;

    background:#f4f4f4;
}

.topbar{

    background:#121212;

    color:#fff;

    padding:18px 35px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:999;
}

.logo{

    font-size:1.8rem;

    font-weight:900;

    color:var(--gold);
}

.user-box{

    display:flex;

    gap:15px;

    align-items:center;
}

.logout-btn{

    background:#c1121f;

    color:#fff;

    border:none;

    padding:10px 18px;

    border-radius:12px;

    cursor:pointer;

    font-weight:bold;
}

.container{

    max-width:1200px;

    margin:auto;

    padding:40px 20px;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(340px,1fr));

    gap:25px;
}

.card{

    background:#fff;

    border-radius:20px;

    padding:30px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

.card h2{

    margin-top:0;

    color:#c1121f;
}

.plan{

    background:#fff4c4;

    padding:20px;

    border-radius:18px;

    margin-bottom:25px;

    line-height:1.8;
}

.plan h3{

    margin-top:0;

    color:#c1121f;
}

.input-group{

    margin-bottom:18px;
}

.input-group label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;
}

.input-group input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid #ddd;

    font-size:15px;
}

.input-group input:focus{

    outline:none;

    border-color:#c1121f;
}

.save-btn{

    width:100%;

    border:none;

    background:#c1121f;

    color:#fff;

    padding:15px;

    border-radius:14px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    margin-top:10px;
}

.save-btn:hover{

    transform:translateY(-2px);
}

.preview{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;
}

.wheel{

    width:280px;

    height:280px;

    border-radius:50%;

    border:10px solid #ffd700;

    background:
    conic-gradient(
        #ff4d4d 0deg 60deg,
        #ffd93d 60deg 120deg,
        #6bcB77 120deg 180deg,
        #4d96ff 180deg 240deg,
        #c77dff 240deg 300deg,
        #ff8fab 300deg 360deg
    );

    position:relative;

    margin-bottom:25px;
}

.center-circle{

    position:absolute;

    width:90px;
    height:90px;

    background:#fff;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    display:flex;

    justify-content:center;

    align-items:center;

    font-weight:bold;

    color:#c1121f;

    box-shadow:0 0 20px rgba(0,0,0,0.15);
}

.preview-title{

    font-size:1.2rem;

    font-weight:bold;

    margin-bottom:10px;
}

.link-box{

    background:#f3f3f3;

    padding:14px;

    border-radius:12px;

    word-break:break-all;

    font-size:14px;

    width:100%;
}

.copy-btn{

    margin-top:12px;

    background:#121212;

    color:#fff;

    border:none;

    padding:12px 20px;

    border-radius:12px;

    cursor:pointer;

    width:100%;
}

.pro-btn{

    background:#ffd700;

    color:#121212;

    font-weight:bold;
}

.message{

    margin-top:18px;

    font-weight:bold;

    text-align:center;

    min-height:24px;
}

@media(max-width:768px){

    .topbar{

        flex-direction:column;

        gap:15px;
    }
}

</style>

</head>

<body>

<div class="topbar">

    <div class="logo">

        SPINEASY BASIC

    </div>

    <div class="user-box">

        <span id="userEmail">

            loading...

        </span>

        <button class="logout-btn"
        onclick="logout()">

            Đăng xuất

        </button>

    </div>

</div>

<div class="container">

    <div class="plan">

        <h3>

            GÓI BASIC - 200K

        </h3>

        ✔ Chỉnh tên quà realtime
        <br>

        ✔ Đồng bộ Firebase cloud
        <br>

        ✔ Link vòng quay riêng
        <br>

        ✔ Tự động lưu dữ liệu
        <br><br>

        ❌ Không upload ảnh
        <br>

        ❌ Không chỉnh xác suất
        <br>

        ❌ Không chỉnh backdrop

    </div>

    <div class="grid">

        <div class="card">

            <h2>

                Chỉnh sửa vòng quay

            </h2>

            <div class="input-group">

                <label>Tên quà 1</label>

                <input type="text"
                id="gift1">

            </div>

            <div class="input-group">

                <label>Tên quà 2</label>

                <input type="text"
                id="gift2">

            </div>

            <div class="input-group">

                <label>Tên quà 3</label>

                <input type="text"
                id="gift3">

            </div>

            <div class="input-group">

                <label>Tên quà 4</label>

                <input type="text"
                id="gift4">

            </div>

            <div class="input-group">

                <label>Tên quà 5</label>

                <input type="text"
                id="gift5">

            </div>

            <div class="input-group">

                <label>Tên quà 6</label>

                <input type="text"
                id="gift6">

            </div>

            <button class="save-btn"
            onclick="saveWheel()">

                <i class="fas fa-save"></i>

                LƯU THAY ĐỔI

            </button>

            <div class="message"
            id="message">

            </div>

        </div>

        <div class="card preview">

            <div class="preview-title">

                PREVIEW VÒNG QUAY

            </div>

            <div class="wheel">

                <div class="center-circle">

                    SPIN

                </div>

            </div>

            <div class="link-box"
            id="wheelLink">

                loading...

            </div>

            <button class="copy-btn"
            onclick="copyLink()">

                COPY LINK

            </button>

            <button class="copy-btn pro-btn"
            onclick="upgradePro()">

                🚀 NÂNG CẤP PRO

            </button>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getAuth,

    onAuthStateChanged,

    signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

    getFirestore,

    doc,

    getDoc,

    setDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyD35Skj_dI0_X7Nsau6fjpPUN5H-Zza8AY",

  authDomain: "spineasy-user.firebaseapp.com",

  projectId: "spineasy-user",

  storageBucket: "spineasy-user.appspot.com",

  messagingSenderId: "805126611420",

  appId: "1:805126611420:web:59a5605b2b68b35f806f19",

  measurementId: "G-NE80YJTEXN"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

onAuthStateChanged(auth,async(user)=>{

    if(user){

        document.getElementById(
        "userEmail"
        ).innerHTML = user.email;

        /* =====================
        CHECK USER PLAN
        ===================== */

        const userRef =
        doc(db,"users",user.uid);

        const userSnap =
        await getDoc(userRef);

        const userData =
userSnap.exists()
? userSnap.data()
: {};

        if(
            userData?.plan === "pro"
        ){

            window.location.href =
            "dashboard-pro.html";

            return;
        }

        /* =====================
        FIX LINK GITHUB
        ===================== */

        const basePath =

        window.location.origin +

        window.location.pathname.substring(
            0,
            window.location.pathname.lastIndexOf("/")
        );

        const wheelUrl =

        basePath +

        "/wheel.html?id=" +

        user.uid;

        document.getElementById(
        "wheelLink"
        ).innerHTML = wheelUrl;

        /* =====================
        LOAD DATA
        ===================== */

        const wheelRef =
        doc(db,"wheels",user.uid);

        const docSnap =
        await getDoc(wheelRef);

        if(!docSnap.exists()){

            await setDoc(

                wheelRef,

                {

                    prizes:[

                        {
                            label:"Voucher 50K",
                            qty:999,
                            weight:10
                        },

                        {
                            label:"Nón bảo hiểm",
                            qty:999,
                            weight:10
                        },

                        {
                            label:"Gấu bông",
                            qty:999,
                            weight:10
                        },

                        {
                            label:"Móc khóa",
                            qty:999,
                            weight:10
                        },

                        {
                            label:"Ly giữ nhiệt",
                            qty:999,
                            weight:10
                        },

                        {
                            label:"Chúc may mắn",
                            qty:999,
                            weight:10
                        }

                    ],

                    history:[]

                }

            );

            location.reload();

            return;
        }

        const data =
        docSnap.data();

        const prizes =
        data.prizes || [];

        document.getElementById("gift1").value =
        prizes[0]?.label || "";

        document.getElementById("gift2").value =
        prizes[1]?.label || "";

        document.getElementById("gift3").value =
        prizes[2]?.label || "";

        document.getElementById("gift4").value =
        prizes[3]?.label || "";

        document.getElementById("gift5").value =
        prizes[4]?.label || "";

        document.getElementById("gift6").value =
        prizes[5]?.label || "";

    }

    else{

        window.location.href =
        "login.html";
    }

});

/* =====================
SAVE
===================== */

async function saveWheel(){

    const user =
    auth.currentUser;

    if(!user) return;

    try{

        const prizes = [

            {
                label:document.getElementById("gift1").value,
                qty:999,
                weight:10
            },

            {
                label:document.getElementById("gift2").value,
                qty:999,
                weight:10
            },

            {
                label:document.getElementById("gift3").value,
                qty:999,
                weight:10
            },

            {
                label:document.getElementById("gift4").value,
                qty:999,
                weight:10
            },

            {
                label:document.getElementById("gift5").value,
                qty:999,
                weight:10
            },

            {
                label:document.getElementById("gift6").value,
                qty:999,
                weight:10
            }

        ];

        await setDoc(

            doc(db,"wheels",user.uid),

            {

                prizes:prizes

            },

            {

                merge:true

            }

        );

        document.getElementById(
        "message"
        ).innerHTML =
        "Đã lưu thành công";

        document.getElementById(
        "message"
        ).style.color =
        "green";

    }

    catch(error){

        console.log(error);

        document.getElementById(
        "message"
        ).innerHTML =
        "Lỗi khi lưu dữ liệu";

        document.getElementById(
        "message"
        ).style.color =
        "red";
    }

}

/* =====================
UPGRADE PRO
===================== */

async function upgradePro(){

    const code = prompt(
    "Nhập mã nâng cấp PRO"
    );

    if(!code) return;

    try{

        const user =
        auth.currentUser;

        if(!user) return;

        const codeRef =
        doc(db,"upgradeCodes",code);

        const codeSnap =
        await getDoc(codeRef);

        if(!codeSnap.exists()){

            alert("Mã không tồn tại");

            return;
        }

        const codeData =
        codeSnap.data();

        if(codeData.used){

            alert("Mã đã được sử dụng");

            return;
        }

        await setDoc(

            doc(db,"users",user.uid),

            {

                plan:"pro"

            },

            {

                merge:true

            }

        );

        await setDoc(

            codeRef,

            {

                used:true,

                usedBy:user.uid,

                usedAt:new Date()

            },

            {

                merge:true

            }

        );

        alert(
        "Nâng cấp PRO thành công"
        );

        window.location.href =
        "dashboard-pro.html";

    }

    catch(err){

        console.log(err);

        alert("Có lỗi xảy ra");
    }

}

/* =====================
COPY LINK
===================== */

function copyLink(){

    const text =
    document.getElementById(
    "wheelLink"
    ).innerText;

    navigator.clipboard.writeText(text);

    alert("Đã copy link");

}

/* =====================
LOGOUT
===================== */

function logout(){

    signOut(auth);

}

window.logout = logout;

window.copyLink = copyLink;

window.saveWheel = saveWheel;

window.upgradePro = upgradePro;
console.log("upgrade ready");

</script>
</body>
</html>
