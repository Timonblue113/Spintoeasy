<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Spineasy Pro Dashboard - Timon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #A733EE; --dark: #1a1a1a; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; margin: 0; height: 100vh; }
        
        /* Sidebar điều khiển */
        .sidebar { width: 350px; background: var(--dark); color: white; padding: 20px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar h2 { color: gold; border-bottom: 2px solid gold; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 20px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        select, input, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; box-sizing: border-box; }
        
        .btn-save { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
        .btn-reset { background: #dc3545; color: white; cursor: pointer; }
        
        /* Khu vực Preview */
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #333; position: relative; }
        canvas { max-width: 90%; max-height: 80vh; background: #fff; border-radius: 50%; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        .prize-item { display: flex; gap: 5px; margin-bottom: 5px; }
        .prize-item input { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2><i class="fas fa-crown"></i> PRO DASHBOARD</h2>
    
    <div class="control-group">
        <label><i class="fas fa-palette"></i> Chọn Theme Màu sắc</label>
        <select id="themeSelect" onchange="updatePreview()">
            <option value="default">Mặc định Spineasy</option>
            <option value="neon">Cyber Neon (Tím - Xanh)</option>
            <option value="luxury">Luxury (Vàng - Đen)</option>
            <option value="pastel">Mùa hè (Pastel)</option>
        </select>
        
        <label><i class="fas fa-image"></i> Hoặc dùng Ảnh nền riêng</label>
        <input type="file" id="bgInput" accept="image/*" onchange="previewImage(this)">
    </div>

    <div class="control-group">
        <label><i class="fas fa-list"></i> Danh sách quà & Tỷ lệ</label>
        <div id="prizeList">
            </div>
        <button onclick="addPrize()" style="background: #444; color: #fff;">+ Thêm quà</button>
    </div>

    <button class="btn-save" onclick="saveToFirebase()"><i class="fas fa-cloud-upload-alt"></i> LƯU & XUẤT BẢN</button>
    <button class="btn-reset" onclick="resetAll()"><i class="fas fa-undo"></i> RESET MẶC ĐỊNH</button>
</div>

<div class="main-content">
    <canvas id="wheelCanvas"></canvas>
    <p style="color: #ccc; margin-top: 20px;">ID của bạn: <span id="displayId" style="color: gold;">---</span></p>
</div>

<script type="module">
    import { db, storage } from "./firebase-config.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Khởi tạo biến
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    let prizes = [
        { label: "Quà 1", weight: 1 },
        { label: "Quà 2", weight: 1 },
        { label: "Quà 3", weight: 1 },
        { label: "Quà 4", weight: 1 }
    ];
    let customImg = null;
    let wheelId = new URLSearchParams(window.location.search).get('id') || "demo-user";
    document.getElementById('displayId').innerText = wheelId;

    const themes = {
        default: ["#FF3D68", "#A733EE", "#2196F3", "#00BCD4", "#FFC107"],
        neon: ["#00f2ff", "#001eff", "#bd00ff", "#d600ff"],
        luxury: ["#1a1a1a", "#aa841e", "#d4af37", "#444"],
        pastel: ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf"]
    };

    // Vẽ Preview
    window.updatePreview = function() {
        const theme = themes[document.getElementById('themeSelect').value];
        const size = 360;
        const center = 375;
        canvas.width = 750;
        canvas.height = 750;
        const arc = (Math.PI * 2) / prizes.length;

        ctx.clearRect(0, 0, 750, 750);

        // 1. Vẽ Nan (Fill)
        for (let i = 0; i < prizes.length; i++) {
            let angle = i * arc;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, size, angle, angle + arc);
            ctx.clip();

            if (customImg) {
                ctx.drawImage(customImg, center - size, center - size, size * 2, size * 2);
                ctx.fillStyle = "rgba(0,0,0,0.15)";
                ctx.fill();
            } else {
                ctx.fillStyle = theme[i % theme.length];
                ctx.fill();
            }
            ctx.restore();
        }

        // 2. Vẽ viền và chữ
        for (let i = 0; i < prizes.length; i++) {
            let angle = i * arc;
            ctx.beginPath();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.moveTo(center, center);
            ctx.lineTo(center + Math.cos(angle) * size, center + Math.sin(angle) * size);
            ctx.stroke();

            // Chữ & Chấm tròn
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(angle + arc / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "right";
            ctx.fillText(prizes[i].label, size - 70, 7);
            
            ctx.beginPath();
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.arc(size * 0.94, 0, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 3. Viền ngoài & Tâm
        ctx.beginPath();
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#fff";
        ctx.arc(center, center, size, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.fillStyle = "#fff";
        ctx.arc(center, center, 20, 0, Math.PI * 2);
        ctx.fill();
    };

    // Quản lý quà
    window.renderPrizes = function() {
        const container = document.getElementById('prizeList');
        container.innerHTML = prizes.map((p, i) => `
            <div class="prize-item">
                <input type="text" value="${p.label}" onchange="prizes[${i}].label=this.value; updatePreview()">
                <button onclick="prizes.splice(${i},1); renderPrizes(); updatePreview()" style="width:40px; background:red">X</button>
            </div>
        `).join('');
    };

    window.addPrize = function() {
        prizes.push({ label: "Quà mới", weight: 1 });
        renderPrizes();
        updatePreview();
    };

    window.previewImage = function(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => { customImg = img; updatePreview(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    };

    // LƯU LÊN FIREBASE
    window.saveToFirebase = async function() {
        try {
            const btn = document.querySelector('.btn-save');
            btn.innerText = "Đang lưu...";
            
            let imgUrl = null;
            const file = document.getElementById('bgInput').files[0];
            
            // Nếu có up ảnh, đẩy lên Storage trước
            if (file) {
                const storageRef = ref(storage, `wheels/${wheelId}/bg.png`);
                await uploadBytes(storageRef, file);
                imgUrl = await getDownloadURL(storageRef);
            }

            // Lưu thông tin vào Firestore
            await setDoc(doc(db, "wheels", wheelId), {
                prizes: prizes,
                theme: document.getElementById('themeSelect').value,
                customBg: imgUrl,
                updatedAt: new Date()
            });

            alert("Đã lưu cấu hình Pro thành công!");
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> LƯU & XUẤT BẢN';
        } catch (e) {
            console.error(e);
            alert("Lỗi khi lưu!");
        }
    };

    // Khởi tạo lần đầu
    renderPrizes();
    updatePreview();
</script>
</body>
</html>
