<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPINEASY PRO DASHBOARD</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
    --primary:#c1121f;
    --gold:#ffd700;
    --dark:#121212;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f4f4f4;
}

/* TOPBAR */
.topbar{
    background:#121212;
    color:#fff;
    padding:18px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.8rem;
    font-weight:900;
    color:var(--gold);
}

/* LAYOUT */
.container{
    max-width:1400px;
    margin:auto;
    padding:40px 20px;
}

.grid{
    display:grid;
    grid-template-columns:1.2fr 0.8fr;
    gap:25px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:30px;
}

/* UPLOAD */
.upload-box{
    background:#fafafa;
    border:2px dashed #ccc;
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
}

.upload-btn{
    background:#121212;
    color:#fff;
    border:none;
    padding:10px 14px;
    margin-top:10px;
    border-radius:10px;
    cursor:pointer;
}

/* PREVIEW */
.preview{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.preview-backdrop{
    width:100%;
    height:180px;
    border-radius:16px;
    background:#ddd;
    background-size:cover;
    background-position:center;
    margin-bottom:20px;
}

/* WHEEL */
.wheel{
    width:280px;
    height:280px;
    border-radius:50%;
    border:10px solid #ffd700;
    position:relative;
    margin-bottom:25px;

    /* DEFAULT PIZZA */
    background:
    conic-gradient(
        #ff4d4d 0deg 60deg,
        #ffd93d 60deg 120deg,
        #6bcB77 120deg 180deg,
        #4d96ff 180deg 240deg,
        #c77dff 240deg 300deg,
        #ff8fab 300deg 360deg
    );
    background-size:cover;
    background-position:center;
}

.center-circle{
    position:absolute;
    width:90px;
    height:90px;
    background:#fff;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    color:#c1121f;
}

/* BUTTON */
.save-btn{
    width:100%;
    border:none;
    background:#c1121f;
    color:#fff;
    padding:15px;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.copy-btn{
    margin-top:12px;
    background:#121212;
    color:#fff;
    border:none;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    width:100%;
}

.reset-btn{
    background:#ff3b3b;
    color:#fff;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    margin-top:8px;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="topbar">
    <div class="logo">SPINEASY PRO</div>
    <div id="userEmail">loading...</div>
</div>

<div class="container">

<div class="grid">

<!-- LEFT -->
<div class="card">

<h2>Dashboard PRO</h2>

<!-- BACKDROP -->
<div class="upload-box">
    <b>Backdrop</b>
    <input type="file" id="backdropFile" accept="image/*">
    <button class="upload-btn" onclick="uploadBackdrop()">Upload</button>
    <button class="reset-btn" onclick="resetBackdrop()">RESET</button>
</div>

<!-- WHEEL -->
<div class="upload-box">
    <b>Wheel Background</b>
    <input type="file" id="wheelFile" accept="image/*">
    <button class="upload-btn" onclick="uploadWheel()">Upload</button>
    <button class="reset-btn" onclick="resetWheel()">RESET PIZZA</button>
</div>

<button class="save-btn" onclick="saveWheel()">LƯU</button>

<div class="message" id="message"></div>

</div>

<!-- RIGHT -->
<div class="card preview">

<div class="preview-backdrop" id="previewBackdrop"></div>

<div class="wheel" id="previewWheel">
    <div class="center-circle">SPIN</div>
</div>

</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyD35Skj...",
  authDomain: "spineasy-user.firebaseapp.com",
  projectId: "spineasy-user"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* IMG API */
const IMGBB = "a144f90aefe3221cee5520a75317e778";

/* STATE */
let uid = "";

/* UPLOAD */
async function upload(file){
    let form = new FormData();
    form.append("image", file);

    let res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB}`, {
        method:"POST",
        body:form
    });

    let data = await res.json();
    return data.data.url;
}

/* BACKDROP */
window.uploadBackdrop = async () => {
    let file = document.getElementById("backdropFile").files[0];
    if(!file) return alert("Chọn ảnh");

    let url = await upload(file);
    document.getElementById("previewBackdrop").style.backgroundImage = `url('${url}')`;
};

/* WHEEL */
window.uploadWheel = async () => {
    let file = document.getElementById("wheelFile").files[0];
    if(!file) return alert("Chọn ảnh");

    let url = await upload(file);
    document.getElementById("previewWheel").style.backgroundImage = `url('${url}')`;
};

/* RESET BACKDROP */
window.resetBackdrop = () => {
    document.getElementById("previewBackdrop").style.backgroundImage = "none";
};

/* RESET WHEEL */
window.resetWheel = () => {
    document.getElementById("previewWheel").style.backgroundImage = "none";
};

/* SAVE */
window.saveWheel = async () => {
    await setDoc(doc(db,"wheels",uid),{
        backdrop: document.getElementById("previewBackdrop").style.backgroundImage,
        wheelBg: document.getElementById("previewWheel").style.backgroundImage
    },{merge:true});

    document.getElementById("message").innerText = "Đã lưu";
};

/* AUTH */
onAuthStateChanged(auth,(user)=>{
    if(!user) return location.href="login.html";

    uid = user.uid;
    document.getElementById("userEmail").innerText = user.email;
});

</script>

</body>
</html>
