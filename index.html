!DOCTYPE html>
<html lang="vi">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0KCLS2V19B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0KCLS2V19B');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPINEASY - Phần Mềm Vòng Quay Realtime Chuyên Nghiệp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #c1121f; --dark-red: #8e0e16; --gold: #ffd700; --neon-blue: #00f2fe; --dark: #121212; }
        .auth-nav { position: fixed; top: 0; right: 0; padding: 15px 30px; z-index: 1000; display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-bottom-left-radius: 20px; }
        .user-info { background: rgba(0,0,0,0.8); color: white; padding: 8px 15px; border-radius: 25px; display: none; align-items: center; gap: 10px; border: 1px solid var(--gold); }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold); }
        .btn-auth { cursor: pointer; background: var(--gold); border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; }
        .role-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: var(--neon-blue); color: #000; text-transform: uppercase; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f4; color: #333; }
        .hero-banner { background: var(--primary) radial-gradient(circle, var(--primary) 0%, var(--dark-red) 100%); color: white; padding: 80px 20px; text-align: center; position: relative; overflow: hidden; border-bottom: 8px solid var(--gold); }
        .banner-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; }
        .left-block { background: rgba(0, 0, 0, 0.3); padding: 40px; border-radius: 20px; text-align: left; }
        .brand-logo { font-size: 3rem; font-weight: 900; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .main-title { font-size: 2.8rem; font-weight: 800; color: var(--gold); line-height: 1.2; margin: 0 0 15px 0; }
        .section { padding: 60px 20px; max-width: 1100px; margin: auto; }
        .pizza-control { display: none; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        footer { background: var(--dark); color: white; text-align: center; padding: 40px; margin-top: 50px; }
    </style>
</head>
<body>

<nav class="auth-nav">
    <div id="user-info" class="user-info">
        <img id="user-avatar" class="user-avatar" src="" alt="">
        <div>
            <span id="user-name" style="font-size: 0.9rem; display: block;"></span>
            <span id="user-role" class="role-badge"></span>
        </div>
        <button id="logout-btn" class="btn-auth" style="background: transparent; color: white; border: 1px solid white;">Thoát</button>
    </div>
    <div id="auth-buttons" style="display: flex; gap: 5px;">
        <button id="login-btn" class="btn-auth"><i class="fab fa-google"></i> Google</button>
    </div>
</nav>

<header class="hero-banner">
    <div class="banner-container">
        <div class="left-block">
            <div class="brand-logo">SPINEASY</div>
            <h1 class="main-title">TẠO VÒNG QUAY<br>REALTIME</h1>
            <div id="pizza-section" class="pizza-control">
                <h3>Quản lý Pizza của bạn</h3>
                <p>Số lượng hiện tại: <span id="pizza-count">0</span></p>
                <input type="number" id="pizza-input" value="0">
                <button id="update-pizza-btn">Cập nhật</button>
            </div>
        </div>
    </div>
</header>

<script type="module">
    import { auth, db, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, setDoc, updateDoc } from './firebase-config.js';

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');
    const pizzaSection = document.getElementById('pizza-section');
    const pizzaCountDisplay = document.getElementById('pizza-count');
    const pizzaInput = document.getElementById('pizza-input');
    const updatePizzaBtn = document.getElementById('update-pizza-btn');

    const provider = new GoogleAuthProvider();

    loginBtn.onclick = async () => {
        try { await signInWithPopup(auth, provider); } catch (error) { alert(error.message); }
    };

    logoutBtn.onclick = () => signOut(auth);

    updatePizzaBtn.onclick = async () => {
        const user = auth.currentUser;
        if (user) {
            await updateDoc(doc(db, "users", user.uid), { pizzaCount: parseInt(pizzaInput.value) });
            pizzaCountDisplay.textContent = pizzaInput.value;
            alert("Đã cập nhật!");
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('auth-buttons').style.display = 'none';
            userInfo.style.display = 'flex';
            pizzaSection.style.display = 'block';
            
            const userRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(userRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                pizzaCountDisplay.textContent = data.pizzaCount || 0;
                pizzaInput.value = data.pizzaCount || 0;
            } else {
                await setDoc(userRef, { email: user.email, pizzaCount: 0, createdAt: new Date().toISOString() });
            }
        } else {
            document.getElementById('auth-buttons').style.display = 'flex';
            userInfo.style.display = 'none';
            pizzaSection.style.display = 'none';
        }
    });
</script>
</body>
</html>
