<script type="module">
    import { auth, db, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, setDoc, createUserWithEmailAndPassword, signInWithEmailAndPassword } from './firebase-config.js';

    const loginBtn = document.getElementById('login-btn');
    const emailLoginBtn = document.getElementById('email-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');
    const userName = document.getElementById('user-name');
    const userAvatar = document.getElementById('user-avatar');
    const userRole = document.getElementById('user-role');

    const provider = new GoogleAuthProvider();

    loginBtn.onclick = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            await checkUserRole(result.user);
        } catch (error) {
            console.error("Login failed", error);
        }
    };

    emailLoginBtn.onclick = async () => {
        const email = prompt("Nhập email:");
        if (!email) return;
        const password = prompt("Nhập mật khẩu:");
        if (!password) return;
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                if (confirm("Tài khoản không tồn tại hoặc sai thông tin. Bạn có muốn đăng ký mới?")) {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } else { alert("Lỗi: " + error.message); }
        }
    };

    logoutBtn.onclick = () => signOut(auth);

    const GITHUB_TOKEN = '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';
    const REPO_OWNER = 'timonblue113';
    const REPO_NAME = 'Spintoeasy';

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('auth-buttons').style.display = 'none';
            userInfo.style.display = 'flex';
            userName.textContent = user.displayName || user.email;
            userAvatar.src = user.photoURL || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';
            await checkUserRole(user);
        } else {
            document.getElementById('auth-buttons').style.display = 'flex';
            userInfo.style.display = 'none';
            document.getElementById('payment-info').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
        }
    });

    async function checkUserRole(user) {
        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);
        let userData;
        if (docSnap.exists()) {
            userData = docSnap.data();
        } else {
            userData = {
                uid: user.uid,
                email: user.email,
                bankAccount: "abc",
                package: "basic",
                createdAt: new Date().toISOString()
            };
            await setDoc(userRef, userData);
        }
        userRole.textContent = userData.package === 'full' ? 'Gói Full Chức Năng (300k)' : 'Gói Bình Thường (200k)';
        
        const isAdmin = user.email === 'timonblue113@gmail.com' || userData.package === 'admin'; 
        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            document.getElementById('admin-panel').style.display = 'none';
        }

        if (userData.package !== 'full' && !isAdmin) {
            document.getElementById('payment-info').style.display = 'block';
            document.getElementById('payment-stk').textContent = userData.bankAccount;
            document.getElementById('payment-content').textContent = `SPIN ${user.uid.substring(0,6)}`;
        } else {
            document.getElementById('payment-info').style.display = 'none';
        }
    }

    const githubEditorArea = document.getElementById('github-editor-area');
    const githubFilePath = document.getElementById('github-file-path');
    const loadGithubBtn = document.getElementById('load-github-btn');
    const saveGithubBtn = document.getElementById('save-github-btn');
    const listGithubBtn = document.getElementById('list-github-btn');

    listGithubBtn.onclick = async () => {
        try {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
            const response = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
            const data = await response.json();
            if (Array.isArray(data)) {
                const files = data.filter(f => f.type === 'file').map(f => f.path).join('\n');
                alert("Các file trong repo:\n" + files);
            }
        } catch (error) { alert("Lỗi khi tải danh sách file"); }
    };

    loadGithubBtn.onclick = async () => {
        try {
            const path = githubFilePath.value || 'index.html';
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            const data = await response.json();
            if (data.content) {
                githubEditorArea.value = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
                githubEditorArea.dataset.sha = data.sha;
                alert(`Đã tải file ${path} thành công!`);
            } else {
                alert("Không tìm thấy file hoặc file trống.");
            }
        } catch (error) {
            console.error(error);
            alert("Lỗi khi tải nội dung từ GitHub");
        }
    };

    saveGithubBtn.onclick = async () => {
        if (!githubEditorArea.dataset.sha) {
            alert("Vui lòng 'Tải nội dung' trước khi lưu!");
            return;
        }
        const path = githubFilePath.value || 'index.html';
        if (!confirm(`Bạn có chắc chắn muốn cập nhật ${path} lên GitHub?`)) return;

        try {
            const content = githubEditorArea.value;
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Update index.html from Web Admin Panel",
                    content: btoa(unescape(encodeURIComponent(content))),
                    sha: githubEditorArea.dataset.sha
                })
            });
            
            if (response.ok) {
                const data = await response.json();
                githubEditorArea.dataset.sha = data.content.sha;
                alert("Cập nhật GitHub thành công! Web sẽ thay đổi sau vài phút.");
            } else {
                const errData = await response.json();
                throw new Error(errData.message || "Lỗi không xác định");
            }
        } catch (error) {
            console.error(error);
            alert("Lỗi khi lưu lên GitHub: " + error.message);
        }
    };
</script>
