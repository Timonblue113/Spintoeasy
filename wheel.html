<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lucky Wheel PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:no-repeat center center;
    background-size:cover;
    height:100vh;
    width:100vw;
    overflow:hidden;
    transition:0.4s;
}

/* =====================
WHEEL
===================== */

#wheelContainer{
    position:absolute;
    right:120px;
    top:50%;
    transform:translateY(-50%);
    width:700px;
    height:700px;
}

canvas{
    width:700px;
    height:700px;
    border-radius:50%;
    overflow:hidden;
    filter:drop-shadow(0 0 20px rgba(0,0,0,0.45));
}

/* =====================
BUTTON
===================== */

#spinBtn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:140px;
    height:140px;
    border-radius:50%;
    font-size:24px;
    font-weight:bold;
    background:radial-gradient(circle,#ffcc70,#ff3c00);
    color:#fff;
    border:5px solid #fff;
    cursor:pointer;
    z-index:10;
}

/* =====================
ARROW
===================== */

#arrow{
    position:absolute;
    right:-20px;
    top:50%;
    transform:translateY(-50%);
    width:0;
    height:0;
    border-top:25px solid transparent;
    border-bottom:25px solid transparent;
    border-right:40px solid gold;
    z-index:20;
}

/* =====================
POPUP
===================== */

.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.box{
    background:#fff;
    padding:30px;
    width:400px;
    border-radius:15px;
    text-align:center;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    background:#f0f0f0;
    border:1px solid #ccc;
    border-radius:5px;
}

.btn{
    padding:12px 25px;
    margin:10px 5px;
    border:none;
    border-radius:5px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.green{
    background:#28a745;
}

.red{
    background:#dc3545;
}

/* =====================
INFO
===================== */

#infoBox{
    position:absolute;
    top:40%;
    left:120px;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.92);
    padding:25px;
    min-width:350px;
    border-radius:15px;
    display:none;
    backdrop-filter:blur(10px);
}

/* =====================
RESULT
===================== */

#resultBox{
    background:#b30000;
    width:500px;
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:#fff;
    position:relative;
    border:5px solid gold;
}

.closeBtn{
    position:absolute;
    top:10px;
    right:20px;
    cursor:pointer;
    font-size:22px;
}

#resultText{
    font-size:48px;
    font-family:'Britannic Bold';
    color:yellow;
}

/* =====================
RESPONSIVE
===================== */

@media(max-width:1100px){

    #wheelContainer{

        position:relative;
        right:auto;
        top:auto;
        transform:none;
        margin:auto;

        width:95vw;
        height:95vw;
    }

    canvas{

        width:95vw;
        height:95vw;
    }

    #infoBox{

        position:relative;
        left:auto;
        top:auto;
        transform:none;
        margin:20px auto;
    }

}

</style>

</head>

<body>

<!-- INFO -->

<div id="infoBox">

    <h2 style="color:#b30000;margin-top:0;">

        SẴN SÀNG!

    </h2>

    <p id="infoName"></p>

    <p id="infoPhone"></p>

    <hr>

    <small>Bạn có 1 lượt quay</small>

</div>

<!-- WHEEL -->

<div id="wheelContainer">

    <div id="arrow"></div>

    <canvas id="wheel"></canvas>

    <button id="spinBtn">

        QUAY

    </button>

</div>

<!-- FORM -->

<div id="formPopup" class="popup">

    <div class="box">

        <h3>Nhập thông tin nhận quà</h3>

        <input
        id="name"
        placeholder="Họ và tên">

        <input
        id="phone"
        placeholder="Số điện thoại"
        type="tel">

        <br>

        <button
        class="btn green"
        onclick="confirmForm()">

            XÁC NHẬN

        </button>

        <button
        class="btn red"
        onclick="closeForm()">

            HỦY

        </button>

    </div>

</div>

<!-- RESULT -->

<div id="resultPopup" class="popup">

    <div id="resultBox">

        <div
        class="closeBtn"
        onclick="closeResult()">

            ✖

        </div>

        <h1>

            🎁 CHÚC MỪNG BẠN ĐÃ TRÚNG THƯỞNG

        </h1>

        <div id="resultText"></div>

    </div>

</div>

<script>

/* =====================
DEFAULT
===================== */

const DEFAULT_PRIZES = [

    { label:"Laptop", qty:10, weight:7 },

    { label:"Tivi", qty:20, weight:14 },

    { label:"Voucher", qty:70, weight:79 }

];

/* =====================
GLOBAL
===================== */

let prizes = DEFAULT_PRIZES;

let history = [];

let spinning = false;

let ready = false;

window.isSpinningLock = false;

let wheelBgImage = "";

let currentUser = {

    name:"",
    phone:""
};

/* =====================
CANVAS
===================== */

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

/* =====================
DRAW
===================== */

function draw(){

    const size = 340;

    const center = 350;

    canvas.width = 700;

    canvas.height = 700;

    const arc =
    Math.PI * 2 / prizes.length;

    const colors = [

        "#FF3D68",
        "#A733EE",
        "#2196F3",
        "#00BCD4",
        "#FFC107",
        "#FF5722",
        "#4CAF50",
        "#E91E63"

    ];

    ctx.clearRect(0,0,700,700);

    if(wheelBgImage){

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            center,
            center,
            size,
            0,
            Math.PI * 2
        );

        ctx.clip();

        ctx.drawImage(
            wheelBgImage,
            center - size,
            center - size,
            size * 2,
            size * 2
        );

        ctx.restore();
    }

    for(let i=0;i<prizes.length;i++){

        const angle =
        i * arc;

        ctx.beginPath();

        ctx.fillStyle =
        colors[i % colors.length];

        ctx.globalAlpha =
        wheelBgImage ? 0.45 : 1;

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            size,
            angle,
            angle + arc
        );

        ctx.fill();

        ctx.globalAlpha = 1;
    }

    for(let i=0;i<prizes.length;i++){

        const angle =
        i * arc;

        ctx.beginPath();

        ctx.strokeStyle =
        "#fff";

        ctx.lineWidth = 3;

        ctx.moveTo(center,center);

        ctx.lineTo(
            center + Math.cos(angle) * size,
            center + Math.sin(angle) * size
        );

        ctx.stroke();

        ctx.save();

        ctx.translate(center,center);

        ctx.rotate(angle + arc / 2);

        ctx.fillStyle = "#fff";

        ctx.font = "bold 22px Arial";

        ctx.textAlign = "right";

        ctx.shadowColor = "#000";

        ctx.shadowBlur = 5;

        ctx.fillText(
            prizes[i].label,
            size - 80,
            8
        );

        ctx.restore();
    }

    ctx.beginPath();

    ctx.lineWidth = 8;

    ctx.strokeStyle = "#fff";

    ctx.arc(
        center,
        center,
        size,
        0,
        Math.PI * 2
    );

    ctx.stroke();
}

/* =====================
FORM
===================== */

function confirmForm(){

    const name =
    document.getElementById("name").value;

    const phone =
    document.getElementById("phone").value;

    if(!name || !phone){

        alert("Nhập đầy đủ thông tin");

        return;
    }

    currentUser = { name, phone };

    ready = true;

    document.getElementById(
    "formPopup"
    ).style.display = "none";

    document.getElementById(
    "infoBox"
    ).style.display = "block";

    document.getElementById(
    "infoName"
    ).innerText =
    "Khách: " + name;

    document.getElementById(
    "infoPhone"
    ).innerText =
    "SĐT: " + phone;
}

function closeForm(){

    document.getElementById(
    "formPopup"
    ).style.display = "none";
}

/* =====================
SPIN
===================== */

document.getElementById(
"spinBtn"
).onclick = ()=>{

    if(spinning) return;

    if(!ready){

        document.getElementById(
        "formPopup"
        ).style.display = "flex";

        return;
    }

    spin();
};

function spin(){

    if(spinning) return;

    spinning = true;

    window.isSpinningLock = true;

    let totalWeight =
    prizes.reduce(

        (sum,p)=>

        sum + (p.qty > 0 ? p.weight : 0),

        0

    );

    let randomNum =
    Math.random() * totalWeight;

    let weightSum = 0;

    let winItem = null;

    let resultIndex = -1;

    for(let i=0;i<prizes.length;i++){

        if(prizes[i].qty > 0){

            weightSum += prizes[i].weight;

            if(randomNum <= weightSum){

                winItem = prizes[i];

                resultIndex = i;

                break;
            }
        }
    }

    let arc =
    360 / prizes.length;

    let stopAngle =

    360 -
    (resultIndex * arc) -
    (arc / 2);

    let totalRotate =
    360 * 10 + stopAngle;

    canvas.style.transition =
    "transform 5s cubic-bezier(0.15,0,0.15,1)";

    canvas.style.transform =
    `rotate(${totalRotate}deg)`;

    setTimeout(async()=>{

        if(winItem.qty > 0){

            winItem.qty--;
        }

        history.push({

            "Thời gian":
            new Date().toLocaleString(),

            "Tên":
            currentUser.name,

            "SĐT":
            currentUser.phone,

            "Quà":
            winItem.label

        });

        if(window.saveFirebase){

            await window.saveFirebase();
        }

        document.getElementById(
        "resultText"
        ).innerText =
        winItem.label;

        document.getElementById(
        "resultPopup"
        ).style.display = "flex";

        spinning = false;

        ready = false;

        window.isSpinningLock = false;

    },5000);
}

function closeResult(){

    document.getElementById(
    "resultPopup"
    ).style.display = "none";

    document.getElementById(
    "infoBox"
    ).style.display = "none";

    document.getElementById(
    "name"
    ).value = "";

    document.getElementById(
    "phone"
    ).value = "";

    canvas.style.transition =
    "none";

    canvas.style.transform =
    "rotate(0deg)";

    draw();
}

</script>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

    getFirestore,
    doc,
    setDoc,
    onSnapshot

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyD35Skj_dI0_X7Nsau6fjpPUN5H-Zza8AY",

  authDomain: "spineasy-user.firebaseapp.com",

  projectId: "spineasy-user",

  storageBucket: "spineasy-user.appspot.com",

  messagingSenderId: "805126611420",

  appId: "1:805126611420:web:59a5605b2b68b35f806f19"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const params =
new URLSearchParams(window.location.search);

const uid =
params.get("id");

const wheelRef =
doc(db,"wheels",uid);

onSnapshot(

    wheelRef,

    async(snapshot)=>{

        if(!snapshot.exists()){

            await setDoc(

                wheelRef,

                {

                    prizes:DEFAULT_PRIZES,
                    history:[],
                    backdrop:"",
                    wheelBg:""

                }

            );

            return;
        }

        if(window.isSpinningLock){

            return;
        }

        const data =
        snapshot.data();

        prizes =
        data.prizes || DEFAULT_PRIZES;

        history =
        data.history || [];

        /* BACKDROP */

        const defaultBackdrop =
        "https://i.ibb.co/dw29MMnJ/DONE.jpg";

        if(data.backdrop){

            document.body.style.backgroundImage =
            `url('${data.backdrop}')`;
        }

        else{

            document.body.style.backgroundImage =
            `url('${defaultBackdrop}')`;
        }

        /* WHEEL IMAGE */

        if(data.wheelBg){

            const img =
            new Image();

            img.crossOrigin =
            "anonymous";

            img.onload = ()=>{

                wheelBgImage = img;

                draw();
            };

            img.src =
            data.wheelBg;
        }

        else{

            wheelBgImage = "";

            draw();
        }

        if(!window.firstLoaded){

            window.firstLoaded = true;

            setTimeout(()=>{

                draw();

            },300);
        }

    }

);

window.saveFirebase =
async()=>{

    await setDoc(

        wheelRef,

        {

            prizes,
            history

        },

        {

            merge:true

        }

    );
};

</script>

</body>
</html>
